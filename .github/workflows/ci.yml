# 每次 push 和 PR 都跑：lint → 格式检查 → 类型检查 → 测试。
# 第 4 周会在这里加评估（cassette 回放）这一步。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # CI 里没有 .env，Settings 需要的值从这里给。都是一次性测试值，不是真密钥。
    env:
      DATABASE_URL: postgresql+asyncpg://wingman:wingman_ci@localhost:5432/wingman
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-not-a-secret

    # 和本地 docker-compose 一样的 Postgres，跑在 job 旁边，通过 localhost:5432 访问
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wingman
          POSTGRES_PASSWORD: wingman_ci
          POSTGRES_DB: wingman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wingman"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked：uv.lock 和 pyproject 对不上就直接失败，保证 CI 和本地装的是同一套版本
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      # ubuntu-latest 自带 Docker，testcontainers 测试在这里能直接跑
      - run: uv run pytest -q
