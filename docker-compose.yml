# 本地开发依赖：Postgres + Redis。
#   启动：docker compose up -d
#   查看：docker compose ps
#   停止：docker compose down        （加 -v 会连数据一起删）
# 账号密码从同目录的 .env 读取（复制 .env.example 得到）。
# 第 5 周部署时，api / worker / caddy 也会加进这个文件。

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # 命名卷：容器删了数据还在
    healthcheck:                            # 让依赖它的服务等它真正可用再启动
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
